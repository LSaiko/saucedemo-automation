name: CI

on:
  push:
  pull_request:
  # the site under test and the runner images both move without us; catch it weekly, not on the next push
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Regenerate visual baselines on each runner and upload them (review, then commit)"
        type: boolean
        default: false

jobs:
  # requirements.txt = editable floors (Dependabot bumps these); requirements.lock = exact pins CI installs.
  # Dependabot can't update a .lock file, so fail loudly when the floors outgrow it instead of testing stale pins.
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pip install uv
      # uv keeps existing pins unless the floors force a change, so this only diffs when requirements.txt moved
      - run: uv pip compile requirements.txt --universal --python-version 3.11 -o requirements.lock -q
      - name: requirements.lock up to date
        run: |
          git diff --exit-code requirements.lock || {
            echo "::error::requirements.lock is stale. Run: uv pip compile requirements.txt --universal --python-version 3.11 -o requirements.lock   then commit it"
            exit 1
          }

  test:
    runs-on: ${{ matrix.os }}  # all GitHub-hosted runners ship with Chrome
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]  # 3.10 is EOL
        # ponytail: full Python matrix on Linux only; other OSes on latest Python (7 jobs, not 15)
        include:
          - { os: windows-latest, python-version: "3.14" }
          - { os: macos-latest, python-version: "3.14" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pytest
        if: ${{ !inputs.update_baselines }}
      # serial + no reruns: one clean capture per page; visual tests only
      - run: pytest tests/visual --update-baselines -n0 --reruns 0
        if: ${{ inputs.update_baselines }}
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.update_baselines }}
        with:
          name: baselines-${{ matrix.os }}-py${{ matrix.python-version }}
          path: visual/baselines/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest-html-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/report.html
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-diffs-${{ matrix.os }}-py${{ matrix.python-version }}
          path: visual/diffs/
          if-no-files-found: ignore
