name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}  # all GitHub-hosted runners ship with Chrome
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # ponytail: full Python matrix on Linux only; other OSes on latest Python (7 jobs, not 15)
        include:
          - { os: windows-latest, python-version: "3.14" }
          - { os: macos-latest, python-version: "3.14" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest-html-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/report.html
      - uses: actions/upload-artifact@v7
        if: failure() && matrix.os == 'windows-latest'
        with:
          name: visual-diffs
          path: visual/diffs/
