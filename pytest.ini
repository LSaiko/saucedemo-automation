[pytest]
testpaths = tests
# --reruns: retry a failing test up to 2x, 3s apart, before calling it a real failure (docs/flaky-policy.md)
addopts = -n auto --reruns 2 --reruns-delay 3 --html=reports/report.html --self-contained-html
markers =
    no_rerun: first-try failure is always a real bug; never retried (docs/flaky-policy.md)
